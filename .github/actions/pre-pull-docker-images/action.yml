name: "Pre-pull Docker images in background"
description: >-
  Kicks off a background `docker pull` (detached with setsid + disown, so the pulls keep running on the
  runner after this step's shell exits) for the first usable base image of every Dockerfile (files named "Dockerfile*")
  found under the given paths, e.g. one Dockerfile per Testcontainers image used by integration tests.
  Only plain "FROM image[:tag|@digest] [AS name]" lines are supported. Keeping the images in Dockerfiles lets
  Dependabot/Renovate keep them up to date and lets test code read the very same files as its single source
  of truth. Call this action right after checkout - before the dependency-cache restore - so the download
  overlaps with dependency resolution/compilation instead of blocking whichever integration test first
  needs the image (Testcontainers otherwise pulls lazily, on demand, serially). If no images are found,
  this action is a no-op.
inputs:
  dockerfile-paths:
    description: >-
      Whitespace/newline-separated list of paths (relative to repo root) to search recursively for files named
      "Dockerfile*". Only the first usable "FROM image[:tag|@digest] [AS name]" image per file is pre-pulled. Lines using
      flags (e.g. --platform), build args ($VAR), "scratch" or references to earlier build stages are ignored.
    required: true
  registry:
    description: "Registry address to log in to, e.g. ghcr.io or myregistry.jfrog.io. Defaults to Docker Hub (docker.io). Only used if both registry-login and registry-password are set."
    required: false
    default: "docker.io"
  registry-login:
    description: "Registry username (optional, e.g. to avoid anonymous rate limits or to pull private images)."
    required: false
  registry-password:
    description: "Registry password or access token (optional)."
    required: false
outputs:
  images:
    description: "Newline-separated list of the images that were pre-pulled (empty if none)."
    value: ${{ steps.collect.outputs.images }}

runs:
  using: "composite"
  steps:
    - name: Collect Docker images to pre-pull
      id: collect
      shell: bash
      env:
        DOCKERFILE_PATHS: ${{ inputs.dockerfile-paths }}
      run: |
        images_file="${RUNNER_TEMP:-/tmp}/pre-pull-docker-images.txt"
        : > "$images_file"

        # Dockerfile content and paths are untrusted (e.g. from a pull request). Everything that is logged is
        # stripped of control characters so it cannot start a workflow command ("::...") or forge log lines.
        clean() { printf '%s' "$1" | tr -d '\000-\037\177'; }
        # Strict whitelist: an image must match the Docker/OCI reference grammar
        # (https://github.com/distribution/reference/blob/main/reference.go):
        #   reference := [domain '/'] path [':' tag] ['@' digest]
        # which only allows letters, digits and . _ - / : @ [ ] in their defined positions (lowercase path, tag max
        # 128 chars, digest "algorithm:hex" with at least 32 hex chars, repository name max 255 chars). This also
        # rules out a leading "-" (docker option) and anything that could break the $GITHUB_OUTPUT format.
        valid_image() {
          local LC_ALL=C ref="$1"
          local alnum='[a-z0-9]+' sep='([._]|__|-+)' dcomp='([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9-]*[a-zA-Z0-9])'
          local pcomp="$alnum($sep$alnum)*"
          local path="$pcomp(/$pcomp)*"
          local domain="($dcomp(\\.$dcomp)*|\\[[a-fA-F0-9:]+\\])(:[0-9]+)?"
          local tag='[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}'
          local digest='[A-Za-z][A-Za-z0-9]*([-_+.][A-Za-z][A-Za-z0-9]*)*:[[:xdigit:]]{32,}'
          [[ "$ref" =~ ^($domain/)?$path(:$tag)?(@$digest)?$ ]] || return 1
          # repository name = reference without digest and tag
          local name="${ref%%@*}"
          [[ "${name##*/}" == *:* ]] && name="${name%:*}"
          [ ${#name} -le 255 ]
        }

        set -f # don't glob-expand the path list
        for dir in $DOCKERFILE_PATHS; do
          case "$dir" in -*) dir="./$dir" ;; esac # never let find treat a path as an option
          if [ ! -e "$dir" ]; then
            echo "Dockerfile path '$(clean "$dir")' not found - skipping"
            continue
          fi
          while IFS= read -r -d '' dockerfile; do
            stages=" "
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}" # tolerate CRLF line endings
              read -r -a words <<< "$line"
              [ "${words[0]^^}" = "FROM" ] || continue
              image="${words[1]}"
              case "${image,,}" in
                scratch) ;;
                ""|--*|*'$'*)
                  echo "Unable to extract image from '$(clean "$line")' (in $(clean "$dockerfile")) - only plain \"FROM image[:tag|@digest] [AS name]\" is supported, skipping"
                  ;;
                *)
                  # skip references to earlier build stages, e.g. "FROM builder"
                  if [[ "$stages" != *" ${image,,} "* ]]; then
                    if valid_image "$image"; then
                      echo "Found $image (in $(clean "$dockerfile"))"
                      echo "$image" >> "$images_file"
                      break
                    else
                      echo "Ignoring invalid image reference '$(clean "$image")' (in $(clean "$dockerfile"))"
                    fi
                  fi
                  ;;
              esac
              # record the stage alias even for FROM lines that are not pulled,
              # e.g. "FROM --platform=$BUILDPLATFORM golang AS builder"
              for ((i = 2; i < ${#words[@]} - 1; i++)); do
                if [ "${words[i]^^}" = "AS" ]; then
                  stages="$stages${words[i + 1],,} "
                fi
              done
            done < "$dockerfile"
          done < <(find "$dir" -type f -name 'Dockerfile*' ! -name '*.dockerignore' -print0)
        done
        set +f

        sort -u -o "$images_file" "$images_file"
        if [ -s "$images_file" ]; then
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "images-file=$images_file" >> "$GITHUB_OUTPUT"
          # random delimiter; the validated images cannot contain newlines or anything that looks like it
          delimiter="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "images<<$delimiter"
            cat "$images_file"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
        else
          echo "No Docker images found - skipping pre-pull"
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Pre-pull Docker images in background
      if: steps.collect.outputs.found == 'true'
      shell: bash
      env:
        IMAGES_FILE: ${{ steps.collect.outputs.images-file }}
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_LOGIN: ${{ inputs.registry-login }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
      run: |
        # The checkout is untrusted; private runner-temp logs cannot follow repository symlinks.
        logs_dir="$(mktemp -d "${RUNNER_TEMP:?}/docker-pull.XXXXXXXXXX")"
        echo "Docker pull logs: $logs_dir"
        if [[ -n "$REGISTRY_LOGIN" && -n "$REGISTRY_PASSWORD" ]]; then
          echo "Logging in to ${REGISTRY:-docker.io}"
          echo "$REGISTRY_PASSWORD" | docker login "${REGISTRY:-docker.io}" -u "$REGISTRY_LOGIN" --password-stdin
        else
          echo "No registry login."
        fi
        while IFS= read -r image; do
          echo "Pre-pulling $image in background"
          logfile="$logs_dir/docker-pull-$(printf '%s' "$image" | tr -c 'a-zA-Z0-9' '-').log"
          setsid docker pull -- "$image" > "$logfile" 2>&1 < /dev/null &
          disown
        done < "$IMAGES_FILE"
