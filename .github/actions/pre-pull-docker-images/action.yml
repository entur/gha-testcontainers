name: "Pre-pull Docker images in background"
description: >-
  Kicks off a background `docker pull` (detached with setsid + disown, so the pulls keep running on the
  runner after this step's shell exits) for the first base image of every simple Dockerfile (files named "Dockerfile*")
  found under the given paths, e.g. one Dockerfile per Testcontainers image used by integration tests.
  Only plain "FROM image[:tag][@digest]" lines are supported, without build stages. Keeping the images in Dockerfiles lets
  Dependabot/Renovate keep them up to date and lets test code read the very same files as its single source
  of truth. Call this action right after checkout - before the dependency-cache restore - so the download
  overlaps with dependency resolution/compilation instead of blocking whichever integration test first
  needs the image (Testcontainers otherwise pulls lazily, on demand, serially). If no images are found,
  this action is a no-op. Pull output is discarded unless "prepare-report" is enabled; see pre-pull-docker-images-report.
inputs:
  dockerfile-paths:
    description: >-
      Whitespace/newline-separated list of paths (relative to repo root) to search recursively for files named
      "Dockerfile*". Only the first FROM line is read, in the form "FROM image[:tag][@digest]".
      Dockerfiles using flags, build args, "scratch" or stage aliases on that line are skipped.
    required: true
  registry:
    description: "Registry address to log in to, e.g. ghcr.io or myregistry.jfrog.io. Defaults to Docker Hub (docker.io). Only used if both registry-login and registry-password are set."
    required: false
    default: "docker.io"
  registry-login:
    description: "Registry username (optional, e.g. to avoid anonymous rate limits or to pull private images)."
    required: false
  registry-password:
    description: "Registry password or access token (optional)."
    required: false
  prepare-report:
    description: >-
      Set to "true" to record the output, exit code and timing of every background pull under $RUNNER_TEMP, for the
      pre-pull-docker-images-report action to show later in the job. Default "false": pull output is discarded.
    required: false
    default: "false"
outputs:
  images:
    description: "Newline-separated list of the images that were pre-pulled (empty if none)."
    value: ${{ steps.collect.outputs.images }}

runs:
  using: "composite"
  steps:
    - name: Collect Docker images to pre-pull
      id: collect
      shell: bash
      env:
        DOCKERFILE_PATHS: ${{ inputs.dockerfile-paths }}
      run: |
        images_file="${RUNNER_TEMP:-/tmp}/pre-pull-docker-images.txt"
        : > "$images_file"

        # Strip control characters from untrusted content before logging it.
        clean() { printf '%s' "$1" | tr -d '\000-\037\177'; }
        # Whitelist characters by reference state; Docker validates the full reference grammar.
        valid_image() {
          local LC_ALL=C ref="$1" state=name char i
          [[ "$ref" == [a-zA-Z0-9]* || "$ref" == \[* ]] || return 1
          [[ "$ref" != *[:/@] ]] || return 1
          for ((i = 0; i < ${#ref}; i++)); do
            char="${ref:i:1}"
            case "$state:$char" in
              name:[a-zA-Z0-9._/:-]|name:\[|name:\]) ;;
              name:@) state=algorithm ;;
              algorithm:[a-zA-Z0-9_+.-]) ;;
              algorithm::) state=digest ;;
              digest:[a-fA-F0-9]) ;;
              *) return 1 ;;
            esac
          done
          [[ "$state" != algorithm ]]
        }

        set -f # don't glob-expand the path list
        for dir in $DOCKERFILE_PATHS; do
          case "$dir" in -*) dir="./$dir" ;; esac # never let find treat a path as an option
          if [ ! -e "$dir" ]; then
            echo "Dockerfile path '$(clean "$dir")' not found - skipping"
            continue
          fi
          while IFS= read -r -d '' dockerfile; do
            while IFS= read -r line || [ -n "$line" ]; do
              read -r instruction image extra <<< "${line%$'\r'}"
              [[ "${instruction^^}" == FROM ]] || continue
              if [[ -n "$image" && -z "$extra" && "${image,,}" != scratch ]] && valid_image "$image"; then
                echo "Found $image (in $(clean "$dockerfile"))"
                echo "$image" >> "$images_file"
              else
                echo "Ignoring unsupported FROM line in $(clean "$dockerfile"): $(clean "$line")"
              fi
              break
            done < "$dockerfile"
          done < <(find "$dir" -type f -name 'Dockerfile*' ! -name '*.dockerignore' -print0)
        done
        set +f

        sort -u -o "$images_file" "$images_file"
        if [ -s "$images_file" ]; then
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "images-file=$images_file" >> "$GITHUB_OUTPUT"
          # random delimiter; the validated images cannot contain newlines or anything that looks like it
          delimiter="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "images<<$delimiter"
            cat "$images_file"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
        else
          echo "No Docker images found - skipping pre-pull"
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Pre-pull Docker images in background
      if: steps.collect.outputs.found == 'true'
      shell: bash
      env:
        IMAGES_FILE: ${{ steps.collect.outputs.images-file }}
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_LOGIN: ${{ inputs.registry-login }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        PREPARE_REPORT: ${{ inputs.prepare-report }}
      run: |
        if [[ -n "$REGISTRY_LOGIN" && -n "$REGISTRY_PASSWORD" ]]; then
          echo "Logging in to ${REGISTRY:-docker.io}"
          echo "$REGISTRY_PASSWORD" | docker login "${REGISTRY:-docker.io}" -u "$REGISTRY_LOGIN" --password-stdin
        else
          echo "No registry login."
        fi

        # Reports live in a private runner-temp directory, never in the (untrusted) checkout, and file names are
        # derived from a hash of the image, never from the image itself. Read by pre-pull-docker-images-report.
        reports_dir=
        if [[ "${PREPARE_REPORT,,}" == true ]]; then
          dir="${RUNNER_TEMP:-/tmp}/pre-pull-docker-images-reports"
          # mkdir -m only applies to a directory it creates, so tighten one left over from an earlier run
          if mkdir -p -m 700 -- "$dir" && [[ -d "$dir" && ! -L "$dir" && -O "$dir" ]] && chmod 700 -- "$dir"; then
            echo 1 > "$dir/format"
            reports_dir="$dir"
          else
            echo "::warning::Cannot use '$dir' for pull reports - continuing without reports"
          fi
        fi

        while IFS= read -r image; do
          if [[ -n "$reports_dir" ]]; then
            id="$(printf '%s' "$image" | sha256sum | cut -c1-12)"
            base="$reports_dir/$id"
            rm -f -- "$base.status" "$base.log"
            printf '%s\t%s\n' "$(date +%s)" "$image" > "$base.meta"
            echo "Pre-pulling $image in background (report $id)"
            # image and path are passed as arguments, never interpolated into the script; $2.status appears atomically
            # (unique temp name per wrapper, so pulls of the same image started twice cannot clobber each other)
            setsid bash -c '
              docker pull -- "$1" > "$2.log" 2>&1
              rc=$?
              printf "%s %s\n" "$rc" "$(date +%s)" > "$2.status.$$.tmp" && mv -f -- "$2.status.$$.tmp" "$2.status"
            ' _ "$image" "$base" > /dev/null 2>&1 < /dev/null &
          else
            echo "Pre-pulling $image in background"
            setsid docker pull -- "$image" > /dev/null 2>&1 < /dev/null &
          fi
          disown
        done < "$IMAGES_FILE"
