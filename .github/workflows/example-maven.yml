name: Example build
# Builds examples/maven twice, with and without pre-pulling its Testcontainers images, so the effect (and the
# pre-pull reports) can be compared. The action is used from this checkout, so a PR tests its own changes.
on:
  push:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - ".github/workflows/example-maven.yml"
      - "examples/maven/**"
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/example-maven.yml"
      - "examples/maven/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  without-pre-pull:
    name: Without pre-pull
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Maven cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('examples/maven/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Maven verify (Testcontainers pulls its images on demand)
        working-directory: examples/maven
        run: |
          start=$SECONDS
          # the example's pom pins an unreleased helper version; build against the released one
          mvn -B -ntp verify -Ddockerfile-helper.version=1.0.1
          echo "mvn verify without pre-pull: $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"

  with-pre-pull:
    name: With pre-pull
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Pre-pull Docker images in background
        uses: ./.github/actions/pre-pull-docker-images
        with:
          dockerfile-paths: examples/maven/src/test/resources/testcontainers
          prepare-report: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Maven cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('examples/maven/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Report - did the pulls finish while Java and the cache were set up?
        uses: ./.github/actions/pre-pull-docker-images-report
      - name: Maven verify (images pre-pulled)
        working-directory: examples/maven
        run: |
          start=$SECONDS
          mvn -B -ntp verify -Ddockerfile-helper.version=1.0.1
          echo "mvn verify with pre-pull: $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Report - final state of the pulls
        if: always()
        uses: ./.github/actions/pre-pull-docker-images-report
