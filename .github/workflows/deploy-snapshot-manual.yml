name: Deploy snapshot to Maven Central
on:
  workflow_dispatch:

jobs:
  deploy-snapshot:
    uses: entur/gha-maven-central/.github/workflows/maven-publish.yml@main
    secrets: inherit
    permissions:
      contents: write
      issues: write
    with:
      snapshot: true
      push_to_repo: false
      next_version: patch
      version_strategy: tag
      version_tag_prefix: v
      java_version: 25
