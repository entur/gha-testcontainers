# cloud-logging's test logback configuration sets no root level, so it would default to DEBUG
logging.level.root=INFO

# Testcontainers startup: the Docker environment, image pulls ("Pulling docker image: ...") and container startup
# ("Container redis:7.2 started in PT0.2S"). Per-image log lines use loggers named tc.<image>.
# Applies because the containers are started by Spring (@ImportTestcontainers), after logging is configured.
# Human-readable log lines (cloud-logging's test artifacts) start with a timestamp.
logging.level.org.testcontainers=INFO
logging.level.tc=INFO
